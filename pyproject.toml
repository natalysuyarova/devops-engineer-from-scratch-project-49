[project]
name = "hexlet-code"
version = "0.1.2"
description = "Brain Games"
readme = "README.md"
authors = [
    { name = "NatS", email = "nsuyarova@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prompt>=0.4.1",
]

[project.scripts]
brain-games = "brain_games.scripts.brain_games:main"
brain-even = "brain_games.scripts.brain_even:main"
#devops-engineer-from-scratch-project-49 = "devops_engineer_from_scratch_project_49:main"


[build-system]
#requires = ["uv_build>=0.12.10,<0.13.0"]
#build-backend = "uv_build"
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain_games"]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]  # не ругаться на длину строк, если она превышает 88

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]  # разрешить импорты не в начале файла в __init__.py
